name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore, build and validate
        shell: pwsh
        run: |
          dotnet restore GwentCompanion.sln
          dotnet build GwentCompanion.sln -c Release --no-restore
          ./tools/Test-PublicRelease.ps1 -RepositoryRoot .
          dotnet run --project tests/GwentCompanion.Tests/GwentCompanion.Tests.csproj -c Release --no-build -- --recording-validation-regression
          dotnet run --project tests/GwentCompanion.Tests/GwentCompanion.Tests.csproj -c Release --no-build -- --contributor-validation-regression
      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          dotnet publish src/GwentCompanion.App/GwentCompanion.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o dist/GwentVision
          New-Item -ItemType Directory -Force dist/GwentVision/cache | Out-Null
          Copy-Item cache/gwent-one-cards.json,cache/create-point-profiles.json,cache/deck-library.json dist/GwentVision/cache
          foreach ($folder in @('portraits','premium-frames','observed-art')) {
            if (Test-Path "cache/$folder") { Copy-Item "cache/$folder" dist/GwentVision/cache -Recurse }
          }
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md dist/GwentVision
          Compress-Archive -Path dist/GwentVision -DestinationPath dist/GwentVision-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/GwentVision-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GwentVision-Windows-x64.zip" | Set-Content dist/GwentVision-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            dist/GwentVision-Windows-x64.zip
            dist/GwentVision-Windows-x64.zip.sha256
          if-no-files-found: error

  scan-and-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-package
      - name: Malware-scan release artifacts
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam
          (cd release-package && sha256sum --check GwentVision-Windows-x64.zip.sha256)
          mkdir release-expanded
          unzip -q release-package/GwentVision-Windows-x64.zip -d release-expanded
          clamscan --recursive --infected --max-filesize=700M --max-scansize=4G release-expanded
          clamscan --recursive --infected --max-filesize=700M --max-scansize=4G release-package
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-package/*
